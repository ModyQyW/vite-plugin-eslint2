name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  merge_group: {}

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        node_version: [ 22, 24, 26 ]
      fail-fast: false

    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js ${{ matrix.node_version }}
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node_version }}
          cache: true

      - name: Check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Build Examples
        run: pnpm -r --filter=./examples/* run build

      - name: Test
        run: pnpm test

      - name: Type Check
        run: pnpm typecheck
